[project]
name = "safari_battle_tracker"
version = "0.3.14"
description = "Live tracking of catch and flee rates in Pokemon Safari Zones."
readme = "src/safari_battle_tracker/resources/PYPI_README.md"
license = "MIT"
authors = [{ name = "Melvin Quick", email = "melvinquick@proton.me" }]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.11.2", "pyyaml>=6.0.3"]

[project.urls]
repository = "https://github.com/melvinquick/safari_battle_tracker"
issues = "https://github.com/melvinquick/safari_battle_tracker/issues"

[project.gui-scripts]
safari-battle-tracker = "safari_battle_tracker.app:main"

[project.scripts]
safari-battle-tracker-cli = "safari_battle_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["bandit>=1.9.4"]
